<body>
  <div class="form-container">
    <h1>LaMore Bouquet´s</h1>
    <form id="pedidoForm">
      <label>Nombre del cliente:</label>
      <input type="text" id="nombre" maxlength="100" placeholder="Nombre/Name" required>

      <label>Cantidad de rosas:</label>
      <select name="cantidad" id="cantidad">
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="75">75</option>
        <option value="100">100</option>
      </select><br>

      <label>Tipo de ramo:</label>
      <select name="tipoRamo" id="tipoRamo" onchange="mostrarColores()">
        <option value="mixto">mixto</option>
        <option value="1">1 color</option>
        <option value="2">2 colores</option>
        <option value="3">3 colores</option>
      </select>

      <div id="coloresContainer"></div>

      <label><input type="checkbox" id="girasol"> Añadir girasol</label>

      <label><input type="checkbox" id="billetesCheck" onchange="mostrarBilletes()"> Añadir billetes</label>
      <div id="billetesOpciones" style="display:none;">
        <select id="billetes">
          <option value="12">12</option>
          <option value="25">25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
      </div>

      <label><input type="checkbox" id="corona"> Añadir corona</label>
      
      <label><input type="checkbox" id="mariposas"> Añadir mariposas</label>
      
      <label><input type="checkbox" id="pins"> Añadir pins de diamante</label>
      

      <label>Cinta:</label>
      <select id="cinta" onchange="mostrarFrase()">
        <option value="no">No</option>
        <option value="si">Sí</option>
      </select>
      <input type="text" id="frase" maxlength="50" style="display:none;" placeholder="Insert phrase / Inserte frase">

      <button type="submit">Enviar pedido</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>
