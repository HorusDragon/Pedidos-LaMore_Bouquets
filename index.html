<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedido de Rosas</title>
</head>
<body>
  <h1>Formulario de pedido de rosas</h1>
  <form id="pedidoForm">
    <label>Cantidad de rosas:</label>
    <select name="cantidad" id="cantidad">
      <option value="25">25</option>
      <option value="50">50</option>
      <option value="75">75</option>
      <option value="100">100</option>
    </select><br><br>

    <label>Tipo de ramo:</label>
    <select name="tipoRamo" id="tipoRamo" onchange="mostrarColores()">
      <option value="1">1 color</option>
      <option value="2">2 colores</option>
      <option value="3">3 colores</option>
    </select><br><br>

    <div id="coloresContainer"></div>

    <label><input type="checkbox" id="girasol"> Añadir girasol</label><br><br>

    <label><input type="checkbox" id="billetesCheck" onchange="mostrarBilletes()"> Añadir billetes</label><br>
    <div id="billetesOpciones" style="display:none;">
      <select id="billetes">
        <option value="12">12</option>
        <option value="25">25</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
    </div><br>

    <label>Cinta:</label>
    <select id="cinta" onchange="mostrarFrase()">
      <option value="no">No</option>
      <option value="si">Sí</option>
    </select><br>
    <input type="text" id="frase" maxlength="50" style="display:none;" placeholder="Insert phrase"><br><br>

    <button type="submit">Enviar pedido</button>
  </form>

  <script src="script.js"></script>
</body>
</html>
